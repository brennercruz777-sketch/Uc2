<body>
    <header>
        <img id="logotipo" src="https://placehold.co/300x200" alt="Foto de Capa">
        <p>Neon Rift</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="planos.html">Edições</a></li>
            <li><a href="contato.html">Lista de Espera</a></li>
        </ul>

    </nav>

    <main>
    <section>
        <h2>Lista de Espera</h2>
        <p>Insira seus dados</p>

        <form class="form-edicoes" action="#" method="post">
            <div>
                <label for="nome">Nome</label>
                <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Como podemos te chamar?"
                required
                >
            </div>

            <div>
                <label for="email">E-mail</label>
                <input 
                type="email"
                id="email"
                name="email"
                placeholder="seuemail@exemplo.com"
                required
                >
            </div>

            <div>
                <label for="telefone">Telefone</label>
                <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(21) 90000-0000"
                pattern="\(?\d{2}\)?\s?\d{5,4}\-?\d{4}"
                >
            </div>

            <div>
                <label for="idade">Idade</label>
                <input
                type="number"
                id="idade"
                name="idade"
                min="16"
                placeholder="Sua idade"
                >
            </div>

            <button class="button-edicoes" type="submit">Entrar na lista de espera</button>
            <button class="button-edicoes" type="reset">Limpar formulário</button>

        </form>

    </section>
    </main>

    <footer>
        <p>2026 Neon Rift. Todos os direitos reservados.</p>
    </footer>

</body>
