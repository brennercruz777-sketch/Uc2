<!DOCTYPE html>
<html lang="pt-br" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css2/style2.css">

    <title>Neon Rift</title>

</head>

<body>
    <header>
        <img src="imagem.png" alt="Minha imagem">
        <p>Neon Rift</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="planos.html">Edições</a></li>
            <li><a href="contato.html">Lista de Espera</a></li>
        </ul>

    </nav>

    <main>
    <section>
        <h2>Lista de Espera</h2>
        <p>Insira seus dados</p>

        <form class="campo">
            <div>
                <label for="nome">Nome</label>
                <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Como podemos te chamar?"
                required
                >
            </div>

            <div>
                <label for="email">E-mail</label>
                <input 
                type="email"
                id="email"
                name="email"
                placeholder="seuemail@exemplo.com"
                required
                >
            </div>

            <div>
                <label for="telefone">Telefone</label>
                <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(21) 90000-0000"
                pattern="\(?\d{2}\)?\s?\d{5,4}\-?\d{4}"
                >
            </div>

            <div>
                <label for="idade">Idade</label>
                <input
                type="number"
                id="idade"
                name="idade"
                min="16"
                placeholder="Sua idade"
                >
            </div>

            <!-- Aula 06 -->

            <!-- Sistema de opções -->
            <div>
                <label for="plataforma">Plataforma preferida</label>
                <select name="plataforma" id="plataforma">
                <option value="">Selecione</option>
                <option value="pc">PC</option>
                <option value="xbox">Xbox</option>
                <option value="playstation">Playstation</option>
                <option value="switch">Nintendo Switch</option>
                </select>
            </div>

            <fieldset>
                <legend>Já jogou algum RPG antes?</legend>

                <label for="rpg-sim">
                    <input 
                    type="radio"
                    id="rpg-sim"
                    name="rpg"
                    value="sim">
                    Sim
                </label>

                <label for="rpg-nao">
                    <input 
                    type="radio"
                    id="rpg-nao"
                    name="rpg"
                    value="nao">
                    Não
                </label>
            </fieldset>

            <fieldset>
                <legend>Preferências</legend>

                <label for="novidades">
                    <input 
                    type="checkbox"
                    id="novidades"
                    name="novidades"
                    value="sim">
                    Aceito receber novidades por E-mail
                </label>

                <label for="beta">
                    <input 
                    type="checkbox"
                    id="beta"
                    name="beta"
                    value="sinm">
                    Tenho interesse em participar do beta
                </label>
            </fieldset>

            <!-- Sistema para escolher uma cor -->
            <div>
                <label for="cor-favorita">Cor de espada favotita</label>
                <input 
                type="color"
                id="cor-favorita"
                name="cor-favorita"
                value="#a020F0">
            </div>

            <!-- Sistema para enviar arquivos -->
            <!-- (accept="") = Para aceitar somente um tipo de arquivo -->
            <div>
                <label for="fanart">Envie sua fanart (opcional)</label>
                <input 
                type="file"
                id="fanart"
                name="fanart"
                accept="image/*">
            </div>

            <!-- Sistema para colocar um bloco de texto -->
            <!-- Rows = Define quantas linhas visíveis de altura terá uma caixa de texto  -->
            <div>
                <label for="recado">Deixe um recado pro estúdio</label>
                <textarea
                id="recado"
                name="recado"
                rows="4"
                placeholder="O que você mais espera do jogo?">
                </textarea>
            </div>
            <button class="botao" type="submit">Entrar na lista de espera</button>
            <button class="botao" type="reset">Limpar formulário</button>

        </form>

    </section>
    </main>

    <footer>
        <p>2026 Neon Rift. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
