<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Exemplo tabela</title>

</head>

<body>
    <h1>Exemplo Tabela</h1>
    <table>
        <caption>Legenda da tabela</caption>
        <thead>
            <tr>
                <th scope="col" class="letra-laranja">Cabeçalho 01</th>
                <th scope="col">Cabeçalho 02</th>
                <th scope="col">Cabeçalho 03</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>A</td>
                <td>1</td>
                <td class="letra-laranja">!</td>
            </tr>
            <tr class="letra-laranja">
                <td>B</td>
                <td>2</td>
                <td>@</td>
            </tr>
            <tr>
                <td>C</td>
                <td>3</td>
                <td>#</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
